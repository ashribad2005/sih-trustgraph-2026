databases:
  - name: trustgraph-db
    databaseName: trustgraph
    user: db_admin
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: trustgraph-api
    runtime: docker
    rootDir: backend
    plan: free
    region: oregon
    dockerCommand: >-
      /bin/sh -c "python manage.py migrate --noinput && exec gunicorn
      --bind 0.0.0.0:${PORT:-8000} --workers 2 --threads 4 --timeout 120
      trustgraph_core.wsgi:application"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustgraph-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: trustgraph-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://trustgraph-frontend-xi.vercel.app
      - key: AI_ENGINE_ENABLED
        value: "True"
      - key: RISK_THRESHOLD
        value: "75"
      - key: SECURE_SSL_REDIRECT
        value: "True"
