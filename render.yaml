databases:
  - name: trustgraph-db
    databaseName: trustgraph
    user: db_admin
    plan: free 
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: trustgraph-api
    runtime: docker
    rootDir: backend
    plan: starter
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trustgraph-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"